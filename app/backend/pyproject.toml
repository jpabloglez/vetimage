[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's historical default selection (pycodestyle errors E4/E7/E9 + pyflakes F).
# CI runs `ruff check .` with no other config; without pinning this, ruff's
# newer/broader default rule set (bandit, blind-except, refurb, ...) surfaces
# hundreds of pre-existing findings unrelated to any given change. This keeps
# ruff equivalent to the flake8 invocation the Makefile uses locally.
select = ["E4", "E7", "E9", "F"]
