[tool.ruff]
target-version = "py312"
# Generated protobuf code — a lint fix here would just be undone by the
# next `protoc` regeneration.
extend-exclude = ["protos/*_pb2.py", "protos/*_pb2_grpc.py"]

[tool.ruff.lint]
# Ruff's historical default selection (pycodestyle errors E4/E7/E9 + pyflakes F).
# CI runs `ruff check .` with no other config; without pinning this, ruff's
# newer/broader default rule set (bandit, blind-except, refurb, ...) surfaces
# hundreds of pre-existing findings unrelated to any given change. This keeps
# ruff equivalent to the flake8 invocation the Makefile uses locally.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Django Channels requires django.setup() (via get_asgi_application()) to
# run before importing anything that touches the app registry — the
# late imports here are load-bearing, not an oversight.
"backend/asgi.py" = ["E402"]
