name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vetimage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: vetimage_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: 'True'
      USE_ORCHESTRATOR: 'False'
      # settings.py defaults these to the Docker Compose hostname
      # redis-vetimage; the redis service container here is on localhost.
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ../../setup/requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - run: pytest --tb=short -q

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src/

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run --reporter=verbose

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f compose/Dockerfile.backend -t vetimage-backend:ci .
      - name: Build frontend image
        run: docker build -f compose/Dockerfile.frontend -t vetimage-frontend:ci .

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # docker-compose.override.yml (dev port-publishing + code-mounts) is only
      # auto-loaded for a bare `docker compose` invocation — this job passes -f
      # explicitly for docker-compose.services.yml, so it must be listed too, or
      # backend-vetimage never publishes :3081 and the readiness wait times out.
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.override.yml
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap backend .env
        # .env is gitignored (real deployments hold secrets there); locally
        # every dev already has one from following the setup docs. Without
        # it, DEBUG defaults to False and settings.py's `not DEBUG` branch
        # turns on SECURE_SSL_REDIRECT, 301-redirecting every plain-HTTP
        # request on this TLS-less runner (including the health check).
        run: cp app/backend/.env.example app/backend/.env

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend deps
        # backend-vetimage/frontend-vetimage bind-mount the repo checkout
        # over the image's build output (see docker-compose.yml), so
        # node_modules must exist on the runner *before* the containers
        # start or the mount shadows what the Docker build installed —
        # frontend-vetimage would come up with `vite: not found`.
        working-directory: app/frontend
        run: npm ci

      - name: Open up checkout permissions for the container's www-data (uid 1000)
        # compose/Dockerfile.* remap www-data to uid 1000 so bind-mounted
        # dev volumes are writable on a typical Linux dev box. The GitHub
        # Actions runner user is uid 1001, so without this Vite can't write
        # its config bundle cache into the bind-mounted app/frontend and
        # the dev server fails with EACCES on startup. Using chmod (not
        # chown) because the runner user also needs to keep writing here
        # directly afterwards (test-results/, playwright-report/).
        #
        # ./data/media is a *separate* bind mount (uploaded DICOM files,
        # shared across backend/celery/vet-thorax-service) that Docker
        # auto-creates root-owned on a fresh checkout since it's gitignored
        # — same fix, but scoped away from data/db and friends, which
        # manage their own container-internal permissions.
        run: |
          chmod -R a+rwX app/backend app/frontend
          mkdir -p data/media
          chmod -R a+rwX data/media

      - name: Start core stack (db, redis, backend, celery worker, frontend)
        # docker-compose.services.yml joins app-network as `external: true`,
        # so the base file must create it first — bringing both files up in
        # one combined command makes Compose treat the network as external
        # from the start, which fails on a fresh runner where it doesn't
        # exist yet.
        run: |
          docker compose -f docker-compose.yml up -d --build \
            db-vetimage redis-vetimage backend-vetimage celery-worker-vetimage frontend-vetimage

      - name: Start orchestrator + vet-thorax reference AI service
        run: |
          docker compose $COMPOSE_FILES up -d --build \
            orchestrator-redis-vetimage orchestrator-vetimage vet-thorax-service

      - name: Wait for backend + frontend to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3081/api/health/ > /dev/null && curl -sf http://localhost:3001/ > /dev/null && break
            echo "Waiting for the stack to come up... ($i)"
            sleep 2
          done
          curl -sf http://localhost:3081/api/health/
          curl -sf http://localhost:3001/ > /dev/null

      - name: Run migrations and seed E2E test data
        run: |
          docker compose $COMPOSE_FILES exec -T backend-vetimage python manage.py migrate
          docker compose $COMPOSE_FILES exec -T backend-vetimage python manage.py seed_e2e_data

      - name: Install Playwright browser
        working-directory: app/frontend
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: app/frontend
        env:
          E2E_BASE_URL: http://localhost:3001
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/frontend/playwright-report/
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: docker compose $COMPOSE_FILES logs backend-vetimage celery-worker-vetimage orchestrator-vetimage vet-thorax-service frontend-vetimage --tail=300

      - name: Tear down
        if: always()
        run: docker compose $COMPOSE_FILES down -v
