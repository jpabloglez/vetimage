# =============================================================================
# Production overrides for the core VetImage stack.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This override sets production environment, restart policies, and a startup
# command that runs migrations + collectstatic before serving. Because -f is
# specified explicitly, docker-compose.override.yml is NOT loaded, so the dev
# code-mounts and the db/redis/Daphne host ports are absent — the base file is
# production-safe by default. See docs/DEPLOYMENT.md §5 (and bring up only the
# prod services; do not start the bundled orthanc test PACS).
#
# Required environment (fail-fast if unset):
#   SECRET_KEY, ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS
# =============================================================================

services:
  backend-vetimage:
    restart: unless-stopped
    # migrate + collect static, then serve via Daphne (ASGI).
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 3080 backend.asgi:application"
    environment:
      - DJANGO_ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required in production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is required in production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in production}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}

  celery-worker-vetimage:
    restart: unless-stopped
    environment:
      - DJANGO_ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required in production}

  celery-beat-vetimage:
    restart: unless-stopped
    environment:
      - DJANGO_ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required in production}

  frontend-vetimage:
    restart: unless-stopped
    # Production serves the **built** bundle from nginx. Overriding only
    # `restart:` here is what used to leave production inheriting
    # `command: npm run dev` from the base file — running the Vite dev server,
    # serving unminified source over HMR, and forcing 'unsafe-inline' and
    # 'unsafe-eval' into the SPA's CSP because HMR needs them.
    build:
      context: .
      dockerfile: ./compose/Dockerfile.frontend
      target: serve
      args:
        # Baked into the bundle at build time by Vite — an image built for one
        # deployment will not work against another. Must be the browser-facing
        # backend origin, not an internal compose hostname.
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required in production}
        VITE_WS_URL: ${VITE_WS_URL:?VITE_WS_URL is required in production}
    # `command:` is overridden to nothing so the base file's `npm run dev`
    # cannot carry through; nginx's own entrypoint runs instead.
    command: []
    # The base healthcheck shells out to curl, which the node image has and
    # nginx:alpine does not — inherited unchanged it would mark a perfectly
    # healthy container unhealthy for ever. busybox wget ships with alpine.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      # The SPA calls the backend cross-origin, so connect-src has to name it.
      # A bare 'self' would put every API call and every WebSocket in
      # violation — and with the policy enforced, that takes the app down.
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-'self' ${VITE_API_URL} ${VITE_WS_URL}}
      - CSP_REPORT_URI=${CSP_REPORT_URI:-; report-uri ${VITE_API_URL}/api/csp-report/}

  db-vetimage:
    restart: unless-stopped

  redis-vetimage:
    restart: unless-stopped
